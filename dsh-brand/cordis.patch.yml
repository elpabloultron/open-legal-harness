# Marca de Open Legal Harness en la interfaz del harness.
#
# Este archivo es el `dsh.bundle.patch` del manifiesto: se aplica como capa de
# perfil. La mitad host (exports ".") corre en el proceso del harness; la mitad
# navegador (exports "./client", servida en /plugins/<id>/client.js) la carga la
# GUI por la declaración `dsh.client`.
#
# Los tres slots que ocupa son `kind: single`, y este plugin es externo (banda
# `extension`), así que toma el relevo de la marca integrada sin desactivarla.
#
# Montar en un perfil:
#   dsh plugin --profile legal add link:/ruta/a/Legal Harness/dsh-brand
- insert:
    - id: ui-openlegal-brand
      name: '@openlegal/dsh-client-ui-brand-legal'
