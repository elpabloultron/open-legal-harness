[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-legal-harness"
version = "0.1.0"
description = "Open Legal Harness: harness legal chileno con CRM (modo abogado solo y modo oficina de abogados)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Pablo Ultrón" }]
keywords = ["legal-tech", "chile", "crm", "derecho-procesal", "art-66-cpc", "abogados"]
dependencies = []

# Postgres (modo oficina) es opcional: solo se requiere el driver.
[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
ui = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]

[project.scripts]
openlegal = "openlegal.cli:main"
# Alias sin colisión: el paquete open-legal-chile también instala un `openlegal`,
# así que en configuraciones de MCP conviene llamar a este por su nombre explícito.
openlegal-crm = "openlegal.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
# Los datos sin los que el paquete no funciona: el esquema, el calendario de feriados
# (de donde salen los dias habiles del art. 66 CPC) y el panel del CRM. Sin esto el
# wheel instala una CLI que no puede crear su base ni levantar su interfaz.
include-package-data = true

[tool.setuptools.package-data]
openlegal = [
  "schema.sql",
  "feriados_cl.json",
  "static/*.html",
  "static/*.css",
  "static/*.js",
  "static/app/*",
  "static/app/assets/*",
]

[tool.setuptools.packages.find]
where = ["src"]

# Estándar de estilo del repo. Se fija acá y no se hereda de la configuración global de
# la máquina, para que lo que ve quien contribuye sea lo mismo que corre en el CI.
[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
ignore = [
    # B008: FastAPI depende de llamadas en los valores por defecto (`Depends(...)`).
    # No lo aplicamos, pero tampoco lo dejamos a medias: el resto de la familia B sí.
    "B008",
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
# El CRM habla con SQLite y PostgreSQL por la misma capa (`DB`), que devuelve dicts
# sueltos: sin `check_untyped_defs` el chequeo se queda en la puerta.
check_untyped_defs = true
warn_unused_ignores = true
