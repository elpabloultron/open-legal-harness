# Modo oficina: PostgreSQL para el Harness Legal.
# Levantar:  docker compose up -d
# Cadena:    postgresql://legal:CAMBIAR_CLAVE@localhost:55432/estudio
# El puerto del host es configurable con OPENLEGAL_PG_PORT (por defecto 55432,
# elegido para no chocar con el 5432 que suele estar tomado en la maquina).
services:
  postgres:
    image: postgres:16-alpine
    container_name: openlegal_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-legal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CAMBIAR_CLAVE}
      POSTGRES_DB: ${POSTGRES_DB:-estudio}
    ports:
      - "127.0.0.1:${OPENLEGAL_PG_PORT:-55432}:5432"
    volumes:
      - openlegal_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-legal} -d ${POSTGRES_DB:-estudio}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  openlegal_pgdata:
