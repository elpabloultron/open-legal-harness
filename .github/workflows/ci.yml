name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pruebas:
    name: pruebas · Python ${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # El núcleo es sólo librería estándar: no hay nada que instalar.
      - name: La suite
        run: python -m unittest discover -s tests -q

  estilo:
    name: estilo y tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ruff (el estándar vive en pyproject, no en la máquina de nadie)
        run: |
          python -m pip install --quiet ruff
          python -m ruff check src tests
      - name: mypy
        run: |
          python -m pip install --quiet mypy
          python -m mypy src/openlegal

  paquete:
    name: el wheel trae sus datos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Construir
        run: |
          python -m pip install --quiet build
          python -m build
      # Esta es la prueba que destapó un defecto real: el wheel salía sin el esquema,
      # sin el calendario de feriados y sin el panel, o sea una CLI incapaz de crear su
      # base, de calcular un plazo (los feriados son la mitad del art. 66 CPC) y de
      # levantar su interfaz. Sin este paso, el paquete puede volver a salir incompleto
      # y nadie se entera hasta que alguien lo instala.
      - name: Los datos tienen que estar adentro
        run: |
          python - <<'PY'
          import glob
          import sys
          import zipfile

          rueda = glob.glob("dist/*.whl")[0]
          with zipfile.ZipFile(rueda) as z:
              nombres = z.namelist()
          obligatorios = ["schema.sql", "feriados_cl.json", "static/panel.html", "static/panel.css", "static/panel.js"]
          faltan = [n for n in obligatorios if not any(x.endswith(n) for x in nombres)]
          if faltan:
              sys.exit(f"el wheel salió sin: {', '.join(faltan)}")
          print(f"el wheel trae los {len(obligatorios)} datos obligatorios")
          PY
      - name: Instalarlo en limpio y crear una base
        run: |
          python -m venv /tmp/limpio
          /tmp/limpio/bin/pip install --quiet dist/*.whl
          /tmp/limpio/bin/openlegal --db sqlite:////tmp/prueba.db init
          /tmp/limpio/bin/openlegal --db sqlite:////tmp/prueba.db estudio crear --nombre "Estudio CI" --modo oficina
          /tmp/limpio/bin/python -c "
          from openlegal import plazos
          feriados = plazos.cargar_feriados(2026)
          assert len(feriados) > 10, feriados
          print(f'calendario: {len(feriados)} feriados de 2026')"

  recursos:
    name: nada queda abierto (lo que Windows castiga)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # En Linux se puede borrar un archivo abierto; en Windows no. Esta es la parte
      # del CI que convierte ese sufrimiento en un aviso temprano: la suite con los
      # extras (para que corran también las pruebas de la web) y cualquier recurso sin
      # cerrar tratado como error.
      - name: La suite con los extras y las fugas como error
        run: |
          python -m pip install --quiet -e ".[ui]"
          python -W error::ResourceWarning -m unittest discover -s tests -q

  plugins:
    name: los plugins de la interfaz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # El build FALLA si el artefacto no respeta el contrato del cargador del navegador
      # (el envoltorio, los externos de React, los slots de la marca, el patch del
      # perfil). Es la red que avisa si una actualización de dsh mueve un punto de
      # enganche: en ese caso el arreglo es en nuestro plugin, nunca en un fork.
      - name: Plugin del CRM
        working-directory: dsh-plugin
        run: |
          npm install --no-audit --no-fund
          npm run build
          npm test
          npm run typecheck
      - name: Plugin de la marca
        working-directory: dsh-brand
        run: |
          npm install --no-audit --no-fund
          npm run build
          npm test
          npm run typecheck

  oficina:
    name: los guiones de la oficina (instalación y respaldo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Todos los guiones tienen que ser bash válido
        run: |
          for guion in scripts/*.sh; do
            bash -n "$guion" || { echo "✗ $guion no es bash válido"; exit 1; }
            echo "  ✓ $guion"
          done
      - name: Instalar el CRM con la interfaz (el instalador usa el comando openlegal)
        run: python -m pip install --quiet -e ".[ui]"
      - name: El respaldo tiene que servir (copia consistente, rotación y base que no existe)
        run: python scripts/prueba_respaldo.py
      - name: El instalador de oficina escribe sus servicios y es idempotente
        run: python scripts/prueba_instalador.py
      - name: Las pruebas del panel (con la interfaz instalada)
        run: python -m unittest tests.test_panel -q
      - name: El panel de verdad (servidor real, HTTP y cookies)
        run: python scripts/prueba_panel.py

  panel:
    name: el panel (React + React-Admin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: pnpm
        run: npm install --global pnpm@10
      - name: Dependencias del panel (con el lockfile, reproducible)
        working-directory: panel
        run: pnpm install --frozen-lockfile
      - name: Pruebas del panel
        working-directory: panel
        run: pnpm run test
      - name: Compilar (y verificar los tipos)
        working-directory: panel
        run: pnpm run build
      - name: El panel compilado del repositorio tiene que estar al dia
        run: |
          if ! git diff --quiet -- src/openlegal/static/app; then
            echo "el panel compilado no coincide con el codigo: compilalo y commitea el resultado"
            git --no-pager diff --stat -- src/openlegal/static/app
            exit 1
          fi
          echo "el panel commiteado coincide con su codigo"
